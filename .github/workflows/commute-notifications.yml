name: Trigger commute notifications

# Runs the proactive commute-notification job (backend/app/jobs/
# send_commute_notifications.py, now Schedule AI's delivery mechanism -
# see app/schedule_engine.py) once per UTC hour - see OPEN_QUESTIONS.md
# for why this lives here rather than a Render cron job (free tier
# doesn't include one) or an in-process scheduler (the free-tier web
# service spins down when idle, so nothing running inside it can
# reliably wake itself up on a schedule).
#
# Unlike the old fixed-7:45am-ET design, no DST-awareness dance is needed
# here anymore: the backend job itself decides, per user, whether NOW is
# inside that specific person's own learned notification window (see
# schedule_engine.is_within_notification_window) - this workflow's only
# job is to call the endpoint reliably once an hour and let the backend
# sort out who (if anyone) actually gets notified. Hourly, not a tighter
# interval, because GitHub Actions cron does not reliably honor sub-hour
# intervals under platform load (confirmed this session with a 10-minute
# keep-alive workflow that actually fired every ~2.5 hours) - an honest
# reliability/precision tradeoff, not an oversight.
on:
  schedule:
    - cron: "0 * * * *" # once per UTC hour, on the hour
  workflow_dispatch: {} # allows a manual run from the Actions tab for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the backend commute-notification job
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://commuteos-backend-wbwk.onrender.com/internal/run-commute-job" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_JOB_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response ($http_code): $body"
          if [ "$http_code" != "200" ]; then
            exit 1
          fi
