[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commuteos-backend"
version = "0.1.0"
description = "CommuteOS Phase 2 backend: personal commute memory (trips, learned preferences, auth)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.x doesn't know about bcrypt 4.1+'s API changes (missing
    # __about__, stricter 72-byte checks during its internal self-test) -
    # pin below that until passlib ships a fix.
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "gtfs-realtime-bindings>=2.2",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Bundled trip_id -> route lookup for NJT bus real-time data (see
# app/transit/njt_bus.py) - must ship with the installed package, not just
# exist in the source tree, since Render's deploy does a real (if
# editable) pip install rather than running from a checked-out repo dir
# in the way local dev implicitly does.
"app.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
